[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge-research"
version = "0.1.0"
description = "Budget-aware calibration for distributed quantum circuit placement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
aer = ["qiskit>=2.0,<3", "qiskit-aer>=0.16,<1"]
dev = ["pytest>=8"]

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
