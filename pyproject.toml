[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbridge-research"
version = "0.1.0"
description = "Budget-aware calibration for distributed quantum circuit placement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
aer = ["qiskit>=2.0,<3", "qiskit-aer>=0.16,<1"]
dev = ["pytest>=8"]
api = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
api-test = ["httpx>=0.27,<1"]

[project.scripts]
qbridge = "qbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["qbridge*", "backend*"]

[tool.setuptools.package-dir]
qbridge = "src/qbridge"
backend = "backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
